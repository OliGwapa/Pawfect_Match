steps:

  # Build backend

  - name: 'gcr.io/cloud-builders/docker'

    dir: 'backend'  # Change directory to /backend

    args: ['build', '-t', 'gcr.io/pawfect-match-backend/pawfect-backend', '.']
 
  # Deploy to Cloud Run

  - name: 'gcr.io/cloud-builders/gcloud'

    args: ['run', 'deploy', 'pawfect-backend', 

           '--image', 'gcr.io/pawfect-match-backend/pawfect-backend',

           '--region', 'asia-southeast1',

           '--platform', 'managed']
 
